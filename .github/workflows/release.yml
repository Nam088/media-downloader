name: Release

# Builds installers for Windows, macOS, and Linux with yt-dlp, gallery-dl AND
# spotiflac-worker bundled as resources (all three as "onedir" builds, unpacked
# once into the app's data directory at first run by
# ytdlp_binary::resolve_ytdlp_executable /
# gallery_dl_binary::resolve_gallery_dl_executable /
# spotiflac_binary::resolve_spotiflac_executable) and ffmpeg bundled as an
# externalBin sidecar (FR-018/SC-008) — end users never install anything
# beyond this one installer. Triggered manually or on a version tag.
#
# All three ship as onedir (executable + a pre-unpacked Python runtime folder)
# rather than the single-file "onefile" build: onefile re-extracts its entire
# bundled runtime into a fresh temp dir on every single launch (~14s
# measured), which is what made preview/download feel slow before this was
# changed — onedir only pays that cost once, on first run. gallery-dl
# additionally has no official standalone build for macOS at all, so its
# onedir build is compiled ourselves in CI for every platform
# (scripts/build-gallery-dl-onedir.sh) rather than downloaded; spotiflac-worker
# is this project's own code and so is always self-built.
# `main` and `develop` build on every push so a broken build is caught on the
# branch that caused it. Any other branch can still be built on demand from the
# Actions tab — `workflow_dispatch` lets you pick the ref — but is not built
# automatically, because a matrix of three OS runners per push on every feature
# branch costs far more than it catches.
#
# Publishing is a separate job and happens only for a `v*` tag whose commit is
# on `main`. The tag alone is not enough: a tag can point at any commit on any
# branch, so the release job verifies ancestry rather than trusting the name.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ytdlp_zip_asset: yt-dlp_win.zip
            ytdlp_exe_name: yt-dlp.exe
            spotiflac_exe_name: spotiflac-worker.exe
            ffmpeg_dest_name: ffmpeg-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ytdlp_zip_asset: yt-dlp_linux.zip
            ytdlp_exe_name: yt-dlp_linux
            spotiflac_exe_name: spotiflac-worker
            ffmpeg_dest_name: ffmpeg-x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
            ytdlp_zip_asset: yt-dlp_macos.zip
            ytdlp_exe_name: yt-dlp_macos
            spotiflac_exe_name: spotiflac-worker
            ffmpeg_dest_name: ffmpeg-aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Node 20 broke the build: with no `packageManager` field in
      # package.json, corepack resolved pnpm to whatever was newest — 11.17.0 —
      # which imports `node:sqlite`, a builtin that only exists from Node 22.5.
      # Every run died before installing a single dependency.
      #
      # The real fix is the `packageManager` pin in package.json, so CI runs
      # the exact pnpm the developer runs instead of drifting to latest on some
      # unrelated upstream release day. This bump is the second half: even a
      # pinned pnpm needs an interpreter new enough for it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Fetch yt-dlp onedir resource (${{ matrix.platform }})
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/yt-dlp-onedir
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp_zip_asset }}" -o yt-dlp-onedir.zip
          unzip -q yt-dlp-onedir.zip -d src-tauri/binaries/yt-dlp-onedir
          chmod +x "src-tauri/binaries/yt-dlp-onedir/${{ matrix.ytdlp_exe_name }}" || true

      # gallery-dl has no official standalone build for macOS, and its
      # official Windows/Linux builds are PyInstaller `--onefile` (same
      # slow-relaunch problem yt-dlp had before onedir). Self-building
      # `--onedir` for every platform, using gallery-dl's own official
      # PyInstaller hook (scripts/pyinstaller-hooks/hook-gallery_dl.py),
      # sidesteps both — see scripts/build-gallery-dl-onedir.sh.
      - name: Build gallery-dl onedir resource (${{ matrix.platform }})
        shell: bash
        run: bash scripts/build-gallery-dl-onedir.sh

      # spotiflac-worker is always self-built: it is this project's own thin
      # protocol wrapper (scripts/spotiflac_worker.py) around the SpotiFLAC
      # pip module — see scripts/build-spotiflac-onedir.sh.
      - name: Build spotiflac-worker onedir resource (${{ matrix.platform }})
        shell: bash
        run: bash scripts/build-spotiflac-onedir.sh

      # PyInstaller exits 0 for a bundle that cannot import its own package,
      # and this is not hypothetical: SpotiFLAC's published wheel metadata
      # omits nodriver even though core/solver.py imports it at module scope,
      # so the first bundle built here died on `import SpotiFLAC` while the
      # build itself looked perfectly green. Without this step that ships as a
      # release, and the only symptom a user sees is music links quietly
      # falling back to yt-dlp.
      #
      # Deliberately offline: an invalid URL still walks the whole import
      # chain and emits the protocol `hello` before failing, so the check
      # proves the bundle loads without depending on a music service being
      # reachable from CI.
      - name: Verify the spotiflac-worker bundle actually loads
        shell: bash
        run: |
          OUTPUT=$(src-tauri/binaries/spotiflac-onedir/${{ matrix.spotiflac_exe_name }} \
            preview --url "not-a-real-url" 2>&1 || true)
          echo "$OUTPUT"
          if ! grep -q '"type":"hello"' <<<"$OUTPUT"; then
            echo "::error::spotiflac-worker bundle failed to start — it never emitted its hello event"
            exit 1
          fi

      # ---- ffmpeg sidecar ---------------------------------------------
      # Linux/Windows: BtbN/FFmpeg-Builds "gpl" static builds — no shared
      # library dependencies, safe to redistribute inside the installer.
      # NOTE: pin to a specific release tag instead of "latest" before a
      # real production release, so builds are reproducible and don't
      # silently pick up an upstream ffmpeg regression.
      - name: Fetch ffmpeg sidecar (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-*-linux64-gpl/bin/ffmpeg "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}"

      - name: Fetch ffmpeg sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          curl -fL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip
          cp ffmpeg-*-win64-gpl/bin/ffmpeg.exe "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}"

      # This step used to pull from evermeet.cx, which publishes x86_64 only —
      # verified, not assumed: its release zip is `Mach-O 64-bit executable
      # x86_64`. The macOS target here is `aarch64-apple-darwin`, so that build
      # would have run through Rosetta 2, which is NOT installed by default on
      # Apple Silicon. A sidecar spawned by the app cannot usefully prompt for
      # it, so every download needing post-processing would have failed on a
      # clean Mac — silently breaking the FR-018/SC-008 promise for exactly the
      # users least able to diagnose it.
      #
      # martin-riedl.de publishes a genuine arm64 build. Checked before
      # adopting: `lipo -archs` reports arm64, and `otool -L` lists nothing
      # outside /System and /usr/lib, so it carries no dependency the target
      # machine has to already have.
      - name: Fetch ffmpeg sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          curl -fL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o ffmpeg.zip
          unzip -q ffmpeg.zip
          cp ffmpeg "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}"
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}"

      # A dynamically-linked ffmpeg runs fine on the machine that built it and
      # fails on every other one, which is the failure mode this whole bundle
      # exists to prevent — and it is invisible until a user reports it. The
      # local dev script copies the system ffmpeg by design, so this guard is
      # what keeps that convenience from ever reaching a release.
      - name: Verify the ffmpeg sidecar is self-contained
        if: matrix.platform == 'macos-latest'
        run: |
          LEAKED=$(otool -L "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}" | tail -n +2 | grep -vE '/System/|/usr/lib/' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::ffmpeg sidecar links against libraries outside the OS:"
            echo "$LEAKED"
            exit 1
          fi
          ARCH=$(lipo -archs "src-tauri/binaries/${{ matrix.ffmpeg_dest_name }}")
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::ffmpeg sidecar is $ARCH, but the target is aarch64-apple-darwin"
            exit 1
          fi

      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: media-downloader-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  # Publishing is deliberately a second job rather than a step in the matrix:
  # a release must contain all three platforms or none, and a step inside the
  # matrix would publish whichever runner finished first, then race the others
  # into the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the ancestry check below needs `main` and the tagged
          # commit in the same clone, and the default shallow fetch has neither.
          fetch-depth: 0

      # A tag can be created on any commit on any branch, so "only main can
      # release" cannot be expressed in the `on:` trigger — it has to be
      # checked. Ancestry rather than equality, so a tag placed a few commits
      # back on main still counts.
      - name: Refuse to publish a tag that is not on main
        run: |
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge to main first, then tag."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
