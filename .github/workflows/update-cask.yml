name: Update Homebrew Cask

# Bumps Casks/media-downloader.rb's version/sha256/url whenever a release is
# published, so the cask never drifts out of sync with what a `brew install`
# would actually fetch — manually editing three fields by hand every release
# is exactly the kind of thing that gets forgotten under time pressure.
#
# Triggered by release.yml finishing, not by the `release: published` webhook
# directly: that webhook fired once during v0.1.3's rollout before the dmg
# assets had finished uploading (a real failure in production — see run
# 30420045671, "No aarch64 .dmg asset found") and never fired at all for
# v0.1.4 (no run exists for it whatsoever). workflow_run only fires after
# release.yml's own job has fully completed, so by the time this runs the
# assets it uploaded are guaranteed to already exist.
#
# Deliberately does NOT reconstruct the asset filename from the release tag.
# v0.1.1 shipped a real rebuild (different sha256) while tauri.conf.json's
# version was never bumped, so its dmg is still literally named
# "..._0.1.0_aarch64.dmg" — a tag-based filename guess would have 404'd.
# Discovering the real asset name and download URL from the release's own
# asset list sidesteps that mismatch entirely, whether or not it recurs.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-cask:
    # Only proceed for a run that (a) actually succeeded, and (b) came from
    # a version-tag push, matching release.yml's own `on: push: tags: v*`
    # trigger — a workflow_dispatch run on a branch has no release to look
    # up. head_branch holds the tag name for tag-triggered runs.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit, not left to the trigger event's default: this job
          # commits and pushes to main, and must never end up in a
          # detached-HEAD checkout of a tag. The old `release: published`
          # trigger checked out the tag by default, which would have made
          # `git push` below fail outright ("not currently on a branch")
          # even if the asset lookup had succeeded.
          ref: main

      - name: Find the macOS assets and their real download URLs
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          find_asset() {
            local suffix="$1"
            gh release view "$TAG" \
              --repo ${{ github.repository }} \
              --json assets \
              --jq ".assets[] | select(.name | endswith(\"$suffix\"))"
          }

          ARM_JSON=$(find_asset "aarch64.dmg")
          if [ -z "$ARM_JSON" ]; then
            echo "::error::No aarch64 .dmg asset found on $TAG — skipping cask update"
            exit 1
          fi

          # Tauri's dmg filename suffix for x86_64-apple-darwin, confirmed
          # against a real release build before relying on it in production.
          INTEL_JSON=$(find_asset "x64.dmg")
          if [ -z "$INTEL_JSON" ]; then
            echo "::error::No x64 .dmg asset found on $TAG — skipping cask update"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "arm_name=$(echo "$ARM_JSON" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "arm_url=$(echo "$ARM_JSON" | jq -r '.url')" >> "$GITHUB_OUTPUT"
          echo "intel_name=$(echo "$INTEL_JSON" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "intel_url=$(echo "$INTEL_JSON" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      - name: Download both assets and compute their checksums
        run: |
          curl -fL "${{ steps.asset.outputs.arm_url }}" -o arm.dmg
          curl -fL "${{ steps.asset.outputs.intel_url }}" -o intel.dmg
          echo "arm_sha256=$(shasum -a 256 arm.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "intel_sha256=$(shasum -a 256 intel.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Update Casks/media-downloader.rb
        env:
          TAG: ${{ steps.asset.outputs.tag }}
          ARM_NAME: ${{ steps.asset.outputs.arm_name }}
          INTEL_NAME: ${{ steps.asset.outputs.intel_name }}
        run: |
          VERSION="${TAG#v}"
          ARM_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$ARM_NAME"
          INTEL_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$INTEL_NAME"

          sed -i -e "s/^  version \".*\"/  version \"$VERSION\"/" Casks/media-downloader.rb

          export NEW_BLOCK=$(cat <<EOF
            # CASK_ARCH_URLS_START
            on_arm do
              sha256 "$arm_sha256"

              url "$ARM_URL"
            end
            on_intel do
              sha256 "$intel_sha256"

              url "$INTEL_URL"
            end

            # CASK_ARCH_URLS_END
          EOF
          )

          perl -0777 -pi -e 's/  # CASK_ARCH_URLS_START.*?# CASK_ARCH_URLS_END/$ENV{NEW_BLOCK}/s' Casks/media-downloader.rb
          cat Casks/media-downloader.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/media-downloader.rb; then
            echo "Cask already up to date"
            exit 0
          fi
          git add Casks/media-downloader.rb
          git commit -m "chore: bump Homebrew Cask to ${{ steps.asset.outputs.tag }} [skip ci]"
          git push
